{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OnMyCamp — Connexion</title>
  <style>
    :root {
      --green: #1a7a4a; --green-dark: #115533;
      --green-light: #e8f5ee; --gold: #f0a500;
      --border: #e2e8e4; --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--green-dark);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .logo-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      margin-bottom: 28px;
    }
    .logo-wrap img {
      width: 90px; height: 90px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }
    .logo-wrap h1 {
      font-size: 28px; font-weight: 800;
      color: white; letter-spacing: -.5px;
    }
    .logo-wrap h1 em { color: var(--gold); font-style: normal; }
    .logo-wrap p {
      font-size: 13px; color: rgba(255,255,255,.6);
    }
    .card {
      background: white; border-radius: 20px;
      padding: 28px 24px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .card h2 {
      font-size: 20px; font-weight: 800;
      color: var(--green); margin-bottom: 6px;
    }
    .card p { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 11px;
      font-weight: 700; color: var(--muted);
      margin-bottom: 5px; text-transform: uppercase;
      letter-spacing: .5px;
    }
    .form-control {
      width: 100%; padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 14px;
      outline: none; transition: border .2s;
      font-family: inherit;
    }
    .form-control:focus { border-color: var(--green); }
    .btn-submit {
      width: 100%; padding: 12px;
      background: var(--green); color: white;
      font-size: 15px; font-weight: 800;
      border: none; border-radius: 10px;
      cursor: pointer; margin-top: 6px;
      transition: background .2s;
    }
    .btn-submit:hover { background: var(--green-dark); }
    .link-row {
      text-align: center; margin-top: 16px;
      font-size: 13px; color: var(--muted);
    }
    .link-row a { color: var(--green); font-weight: 700; }
    .alert {
      padding: 10px 14px; border-radius: 9px;
      font-size: 13px; font-weight: 600;
      margin-bottom: 14px;
      background: #ffeeee; color: #cc3333;
    }
  </style>
</head>
<body>

  <div class="logo-wrap">
    <img src="{% static 'images/Logo.png' %}" alt="OnMyCamp">
    <h1>On<em>My</em>Camp</h1>
    <p>Le réseau social de l'IAI Cameroun</p>
  </div>

  <div class="card">
    <h2>Connexion</h2>
    <p>Connecte-toi à ton espace étudiant</p>

    {% if messages %}
      {% for m in messages %}
      <div class="alert">❌ {{ m }}</div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" name="username" class="form-control"
          placeholder="Ton username" required autofocus>
      </div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" name="password" class="form-control"
          placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-submit">Se connecter →</button>
    </form>

    <div class="link-row">
      Pas encore de compte ?
      <a href="{% url 'register' %}">S'inscrire</a>
    </div>
  </div>

</body>
</html>
